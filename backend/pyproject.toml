[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends in function defaults
    "BLE001",   # Catching broad Exception
    "S110",    # try-except-pass
    "TRY002",   # Custom exception class requirement
    "RUF013",   # Implicit Optional for default None
    "RUF059",   # Unused unpacked variables in tests
]
